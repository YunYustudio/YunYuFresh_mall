server:
  port: 8080

spring:
  application:
    name: Mall_YunYu

  # 开启虚拟线程(JDK21特性,IO密集型性能提升)
  threads:
    virtual:
      enabled: true

  # 数据源 - 生产环境通过环境变量注入
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fresh_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: FreshMallHikariPool
      # 连接存活校验,避免连接断开
      connection-test-query: SELECT 1

  # Redis - 无密码,不配置 password
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 5000ms

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus - 生产环境关闭 SQL 日志
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall_yunyu.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Knife4j - 生产环境禁用
knife4j:
  enable: false
  production: true
  openapi:
    title: 生鲜商城接口文档
    description: 生鲜商城小程序API
    version: 1.0.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.mall_yunyu.controller

# 业务自定义配置 - 生产环境
mall:
  security:
    # sys_config 中 APIv3密钥/COS SecretKey 的 AES 加密种子(与本地 dev 默认种子一致,可解密已有密文)
    config-secret: mall_yunyu_default_secret
  cert:
    # 微信支付证书目录,须挂载为持久化卷且不对外暴露;权限建议 chmod 600
    path: ${MALL_CERT_PATH:/data/mall/certs}
  upload:
    # 本地存储兜底目录,容器部署务必挂载持久化卷,否则重新发版图片全丢
    path: ${MALL_UPLOAD_PATH:/data/mall/uploads}
    url-prefix: /uploads
    # 生产必须设置对外域名,否则库里会存成内网地址
    domain: ${MALL_UPLOAD_DOMAIN:}
    max-size-mb: 5
    allow-ext: jpg,jpeg,png,gif,webp,bmp

# 微信小程序配置 - 通过环境变量注入
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:your-miniapp-appid}
    secret: ${WX_MINIAPP_SECRET:your-miniapp-secret}
  # 微信支付V3兜底配置(权威来源为 sys_config 表)
  pay:
    appid: ${WX_PAY_APPID:}
    mch-id: ${WX_PAY_MCH_ID:}
    api-v3-key: ${WX_PAY_API_V3_KEY:}
    cert-serial-no: ${WX_PAY_CERT_SERIAL_NO:}
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:classpath:cert/apiclient_key.pem}
    private-cert-path: ${WX_PAY_PRIVATE_CERT_PATH:classpath:cert/apiclient_cert.pem}
    notify-url: ${WX_PAY_NOTIFY_URL:https://your-domain.com/api/publicly/payment/callback/wechat/ma}
    refund-notify-url: ${WX_PAY_REFUND_NOTIFY_URL:https://your-domain.com/api/publicly/payment/callback/wechat/refund/ma}
